<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCMCH Tremor Monitor</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --accent: #ff7846; --accent2: #58a6ff; --text: #e6edf3;
    --text-dim: #8b949e; --good: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px; max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font-size: 0.95rem; font-weight: 500; padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--border); background: #21262d; color: var(--text); cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1006; }
  button.primary:hover:not(:disabled) { background: #ff8a5f; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.danger:hover:not(:disabled) { background: #ff6b62; }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 8px; }
  .status-dot.connected { background: var(--good); }
  .status-line { display: flex; align-items: center; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 14px; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
  .metric-card { background: #0d1117; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .metric-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric-value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
  .metric-value.current { color: var(--accent); }
  .metric-value.low { color: var(--accent2); }
  .metric-value.high { color: var(--bad); }
  .rec-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; background: #21262d; color: var(--text-dim); }
  .rec-indicator.active { color: var(--bad); }
  .rec-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .rec-indicator.active .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .buffer-info { font-size: 0.85rem; color: var(--text-dim); margin-top: 10px; }
  .device-info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 0.82rem; color: var(--text-dim); margin-top: 10px; }
  .device-info span.v { color: var(--text); }
  .progress-wrap { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; height: 8px; overflow: hidden; margin-top: 10px; display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar { height: 100%; background: var(--accent2); width: 0%; transition: width 0.15s; }
  .log {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: var(--text-dim);
    height: 140px; overflow-y: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>

  <h1>BCMCH Tremor Monitor</h1>
  <div class="subtitle">Web Bluetooth companion for the BCMCH Sensor Hub (v5.1.0 tremor firmware).</div>

  <div class="panel">
    <div class="status-line">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Not connected</span>
    </div>
    <div class="row">
      <button id="btnConnect" class="primary">Connect device</button>
      <button id="btnDisconnect" disabled>Disconnect</button>
    </div>
    <div class="device-info" id="deviceInfo" style="display:none;">
      <div>Battery: <span class="v" id="diBattery">--</span></div>
      <div>TF card: <span class="v" id="diTf">--</span></div>
      <div>Device time (IST): <span class="v" id="diTime">--</span></div>
      <div>CSV buffer: <span class="v" id="diCsv">--</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content: space-between; margin-bottom: 6px;">
      <strong>Recording</strong>
      <span id="recIndicator" class="rec-indicator"><span class="dot"></span><span id="recText">Stopped</span></span>
    </div>
    <div class="row">
      <button id="btnStart" class="primary" disabled>Start recording</button>
      <button id="btnStop" class="danger" disabled>Stop recording</button>
      <button id="btnRefresh" disabled>Refresh buffer</button>
      <button id="btnDownload" disabled>Download CSV</button>
    </div>
    <div class="buffer-info" id="bufferInfo">No data on device yet</div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div class="panel">
    <strong>Live tremor severity</strong>
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-label">Current</div><div class="metric-value current" id="mCurrent">--</div></div>
      <div class="metric-card"><div class="metric-label">Session low</div><div class="metric-value low" id="mLow">--</div></div>
      <div class="metric-card"><div class="metric-label">Session high</div><div class="metric-value high" id="mHigh">--</div></div>
    </div>
  </div>

  <div class="panel">
    <strong>Log</strong>
    <div class="log" id="logBox"></div>
  </div>

<script>
// ============================================================================
// BCMCH Tremor Monitor - Web Bluetooth client
// Matches the ACTUAL GATT layout of W146_v5_1_0_tremor.ino (adapted from the
// user's working BCMCH Sensor Hub firmware) -- NOT the earlier from-scratch
// design. Key differences from a naive design worth knowing:
//   - IMU characteristic is a human-rate (~20Hz) JSON live-preview stream,
//     not the full 200Hz log -- the full-rate data is captured on-device
//     (PSRAM ring + optional TF card) and pulled on demand via XFER_*.
//   - CSV download pulls the device's own authoritative CSV buffer over
//     XFER_DATA, rather than the browser reconstructing a file from
//     whatever it happened to receive live. More robust against any
//     dropped BLE notifications during the live preview.
//   - CMD characteristic takes UTF-8 text commands ("start_imu_rec" etc.),
//     not single command bytes.
// ============================================================================
const SVC_UUID        = '6f2a0000-9b1e-4c7a-8b2a-9f7e6a2b0000';
const CHAR_IMU_UUID    = '6f2a0001-9b1e-4c7a-8b2a-9f7e6a2b0000'; // notify, JSON
const CHAR_CMD_UUID    = '6f2a0002-9b1e-4c7a-8b2a-9f7e6a2b0000'; // write, text
const CHAR_STATUS_UUID = '6f2a0003-9b1e-4c7a-8b2a-9f7e6a2b0000'; // read, JSON
const CHAR_TIME_UUID   = '6f2a0004-9b1e-4c7a-8b2a-9f7e6a2b0000'; // write, 8B LE epoch-ms
const CHAR_XFER_CTRL_UUID = '6f2a0005-9b1e-4c7a-8b2a-9f7e6a2b0000'; // write
const CHAR_XFER_DATA_UUID = '6f2a0006-9b1e-4c7a-8b2a-9f7e6a2b0000'; // read, raw CSV bytes (fetched per chunk)
const CHAR_XFER_INFO_UUID = '6f2a0007-9b1e-4c7a-8b2a-9f7e6a2b0000'; // read, 4B LE uint32 total bytes
// P5 (v5.1.9): write a 4B LE offset here to request that chunk, then
// read CHAR_XFER_DATA to fetch it -- replaces the old notify-push design
// with explicit, confirmed, individually-retryable request/response
// reads. See README for why: repeated real-world testing showed BLE
// notifications getting silently dropped under sustained load in ways
// no amount of pacing/contention/interval tuning fully solved.
const CHAR_XFER_SEEK_UUID = '6f2a0008-9b1e-4c7a-8b2a-9f7e6a2b0000'; // write, 4B LE offset

let device = null, server = null;
let charImu, charCmd, charStatus, charTime, charXferCtrl, charXferData, charXferInfo, charXferSeek;

// ---- GATT operation queue ----
// Web Bluetooth throws ("GATT operation already in progress") if two
// read/write calls on the SAME device overlap in flight. This app has a
// background status poll running every 3s AND user-triggered writes
// (Start/Stop/Refresh/Download) that can happen at any time -- without
// serializing them, a download attempt that happens to start while a
// status poll is in flight can fail outright. Every read/write in this
// file goes through gattOp() so they're strictly queued, never concurrent.
let gattQueue = Promise.resolve();
function gattOp(fn) {
  const run = gattQueue.then(fn, fn); // run after the previous op settles, regardless of its outcome
  gattQueue = run.then(() => {}, () => {}); // never let a failed op poison the chain
  return run;
}

let recording = false;
let statusPollTimer = null;
let lastKnownCsvRows = 0;   // updated by pollStatus(), used to warn before an overwrite
let lastKnownCsvBytes = 0;  // updated by pollStatus(), used to sanity-check XFER_INFO totals
let lastKnownBatLow = false; // updated by pollStatus(), used to warn before a download attempt

// CSV download state
let xferActive = false;
let xferTotal = 0;
let xferChunks = [];
let xferReceived = 0;

const el = (id) => document.getElementById(id);
const statusDot = el('statusDot'), statusText = el('statusText');
const btnConnect = el('btnConnect'), btnDisconnect = el('btnDisconnect');
const btnStart = el('btnStart'), btnStop = el('btnStop'), btnRefresh = el('btnRefresh'), btnDownload = el('btnDownload');
const recIndicator = el('recIndicator'), recText = el('recText');
const bufferInfo = el('bufferInfo'), deviceInfo = el('deviceInfo');
const diBattery = el('diBattery'), diTf = el('diTf'), diTime = el('diTime'), diCsv = el('diCsv');
const progressWrap = el('progressWrap'), progressBar = el('progressBar');
const mCurrent = el('mCurrent'), mLow = el('mLow'), mHigh = el('mHigh');
const logBox = el('logBox');

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logBox.textContent += `[${t}] ${msg}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

function setConnectedUI(connected) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = connected ? 'Connected' : 'Not connected';
  btnConnect.disabled = connected;
  btnDisconnect.disabled = !connected;
  btnStart.disabled = !connected || recording;
  btnStop.disabled = !connected || !recording;
  btnRefresh.disabled = !connected;
  deviceInfo.style.display = connected ? 'grid' : 'none';
  if (!connected) btnDownload.disabled = true;
}

function setRecordingUI(isRecording) {
  recording = isRecording;
  recIndicator.classList.toggle('active', isRecording);
  recText.textContent = isRecording ? 'Recording' : 'Stopped';
  btnStart.disabled = !server || isRecording;
  btnStop.disabled = !server || !isRecording;
}

// ---- Connect flow ----
btnConnect.addEventListener('click', async () => {
  if (!navigator.bluetooth) {
    log('ERROR: Web Bluetooth not supported (use Chrome/Edge on desktop or Android -- not Safari/Firefox).');
    return;
  }
  try {
    log('Requesting device (look for "BCMCH_Sensor_XXXXXX")...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC_UUID] }],
      optionalServices: [SVC_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);

    log(`Connecting to ${device.name || 'device'}...`);
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC_UUID);

    charImu      = await svc.getCharacteristic(CHAR_IMU_UUID);
    charCmd      = await svc.getCharacteristic(CHAR_CMD_UUID);
    charStatus   = await svc.getCharacteristic(CHAR_STATUS_UUID);
    charTime     = await svc.getCharacteristic(CHAR_TIME_UUID);
    charXferCtrl = await svc.getCharacteristic(CHAR_XFER_CTRL_UUID);
    charXferData = await svc.getCharacteristic(CHAR_XFER_DATA_UUID);
    charXferInfo = await svc.getCharacteristic(CHAR_XFER_INFO_UUID);
    charXferSeek = await svc.getCharacteristic(CHAR_XFER_SEEK_UUID);

    await charImu.startNotifications();
    charImu.addEventListener('characteristicvaluechanged', onImuNotify);

    // P5: charXferData is no longer a notify characteristic -- chunks are
    // fetched with explicit reads inside startCsvDownload() now.

    await sendTimeSync();
    await pollStatus();
    statusPollTimer = setInterval(pollStatus, 3000);

    setConnectedUI(true);
    log('Connected and time-synced.');
  } catch (err) {
    log(`Connection failed: ${err}`);
    setConnectedUI(false);
  }
});

btnDisconnect.addEventListener('click', () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
});

function onDisconnected() {
  log('Device disconnected.');
  if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
  setConnectedUI(false);
  setRecordingUI(false);
}

async function sendTimeSync() {
  const epochMs = BigInt(Date.now());
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, epochMs, true); // little-endian, matches TimeCallbacks
  await gattOp(() => charTime.writeValue(buf));
  log(`Time synced: ${new Date().toISOString()}`);
}

async function sendCmd(text) {
  const enc = new TextEncoder();
  await gattOp(() => charCmd.writeValueWithoutResponse(enc.encode(text)));
}

// ---- Recording controls ----
// NOTE: this firmware separates AUDIO recording ("start_rec"/"stop_rec")
// from IMU recording ("start_imu_rec"/"stop_imu_rec") -- these buttons use
// the IMU commands, since that's what feeds the tremor CSV.
// As of firmware v5.1.2 (D1), start_imu_rec APPENDS to the existing
// downloadable buffer rather than clearing it -- multiple Start/Stop
// segments across a session accumulate into one growing file. Only
// "Refresh buffer" clears it. (Older firmware without D1 will silently
// wipe the buffer on every Start -- if you see rows disappear after a
// second Start, that's the tell that this fix isn't flashed yet.)
btnStart.addEventListener('click', async () => {
  await sendCmd('start_imu_rec');
  setRecordingUI(true);
  log(`IMU recording started (start_imu_rec) -- appending to existing buffer (${lastKnownCsvRows.toLocaleString()} rows already present).`);
});

btnStop.addEventListener('click', async () => {
  await sendCmd('stop_imu_rec');
  setRecordingUI(false);
  log('IMU recording stopped (stop_imu_rec).');
  await pollStatus(); // refresh row count promptly rather than waiting for the next 3s tick
});

btnRefresh.addEventListener('click', async () => {
  await sendCmd('reset_csv');
  log('Buffer refreshed: device CSV buffer cleared, tremor severity min/max reset.');
  await pollStatus();
});

btnDownload.addEventListener('click', async () => {
  if (lastKnownBatLow) {
    log('Battery is low -- the device will refuse this download rather than risk a failed transfer. Please charge the device before downloading.');
    return;
  }
  await startCsvDownload();
});

// ---- Live IMU / severity notifications ----
// IMU characteristic sends a JSON string per notification (~20Hz), e.g.:
// {"ax":..,"ay":..,"az":..,"gx":..,"gy":..,"gz":..,"temp":..,"ts":..,
//  "sev":..,"sevMin":..,"sevMax":..}
const jsonDecoder = new TextDecoder('utf-8');

function onImuNotify(event) {
  let data;
  try {
    // Defensive: DataView.buffer is the underlying ArrayBuffer, which can
    // be larger than the view itself -- always respect byteOffset/byteLength
    // rather than assuming the view starts at 0 and spans the whole buffer.
    const dv = event.target.value;
    const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    data = JSON.parse(jsonDecoder.decode(bytes));
  } catch (e) {
    return; // partial/corrupt frame, just skip it -- next notify will be fine
  }
  if (typeof data.sev === 'number') mCurrent.textContent = data.sev.toFixed(1);
  if (typeof data.sevMin === 'number') mLow.textContent = data.sevMin.toFixed(1);
  if (typeof data.sevMax === 'number') mHigh.textContent = data.sevMax.toFixed(1);
}

// ---- STATUS polling (device name, battery, TF card, RTC time, CSV size) ----
async function pollStatus() {
  if (!charStatus) return;
  if (xferActive) return; // don't contend with an in-progress CSV download
  try {
    const val = await gattOp(() => charStatus.readValue());
    const dv = val;
    const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    const status = JSON.parse(jsonDecoder.decode(bytes));
    diBattery.textContent = status.batLow ? `${status.batMv}mV (LOW)` : `${status.batMv}mV`;
    diTf.textContent = !status.tfCard ? 'not present' : (status.tfFull ? 'FULL' : `ok (${status.tfFile || ''})`);
    diTime.textContent = status.time || '--';
    diCsv.textContent = `${(status.csvBytes || 0).toLocaleString()} bytes / ${(status.csvRows || 0).toLocaleString()} rows`;
    lastKnownCsvRows = status.csvRows || 0;
    lastKnownCsvBytes = status.csvBytes || 0;
    lastKnownBatLow = !!status.batLow;
    bufferInfo.textContent = status.csvRows > 0
      ? `${status.csvRows.toLocaleString()} rows buffered on device (accumulates across Start/Stop until you Refresh)`
      : 'No data on device yet';
    if (status.csvNearFull) {
      bufferInfo.textContent += ' -- WARNING: buffer nearly full, download and refresh soon or new rows will stop being recorded.';
    }
    btnDownload.disabled = !(status.csvRows > 0) || xferActive;
    // Reflect actual device recording state in case it was started/stopped
    // by another client, or is left over from a previous session.
    if (typeof status.imuRecording === 'boolean' && status.imuRecording !== recording) {
      setRecordingUI(status.imuRecording);
    }
  } catch (e) {
    log(`Status read failed: ${e}`);
  }
}

// ---- CSV download via XFER_CTRL (start) / XFER_SEEK+XFER_DATA (P5: read
// loop) / XFER_INFO (total size) ----
// Everything here goes through gattOp() so it can never overlap with the
// background status poll (pollStatus() also now skips itself entirely
// while xferActive is true, as a second layer of protection).
let xferWakeLock = null; // Screen Wake Lock held for the duration of a download

// P5 (v5.1.9): switched from notify-push to explicit request/response
// reads after repeated real-world testing showed BLE notifications
// getting silently dropped under sustained load -- no amount of pacing,
// live-preview-contention removal, or connection-interval tuning fully
// solved it. Every chunk here is now individually confirmed and
// retryable; there's no way for one to silently vanish. A screen wake
// lock is still held for the duration, since a backgrounded/sleeping
// phone can still throttle the JS driving this loop even though
// individual chunk failures are no longer catastrophic the way a lost
// notification used to be.
async function acquireXferWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      xferWakeLock = await navigator.wakeLock.request('screen');
      log('Screen wake lock acquired -- keep this tab open until the download finishes.');
    } else {
      log('NOTE: this browser doesn\'t support Screen Wake Lock -- please keep the screen on manually until the download finishes.');
    }
  } catch (e) {
    log(`Could not acquire screen wake lock (${e}) -- please keep the screen on manually during the download.`);
  }
}

function releaseXferWakeLock() {
  if (xferWakeLock) {
    xferWakeLock.release().catch(() => {});
    xferWakeLock = null;
  }
}

// Bounds any single GATT operation so a hung write/read can't stall the
// pull loop forever -- it'll time out, count as a failed attempt, and
// get retried (or the chunk gives up) instead of hanging indefinitely.
function withTimeout(promise, ms, label) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms);
    promise.then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
  });
}

const XFER_CHUNK_MAX_RETRIES = 3;
const XFER_CHUNK_RETRY_DELAY_MS = 250;
const XFER_CHUNK_TIMEOUT_MS = 4000;

async function startCsvDownload() {
  if (xferActive) { log('Download already in progress.'); return; }
  try {
    xferChunks = [];
    xferReceived = 0;
    xferTotal = 0;
    xferActive = true;
    btnDownload.disabled = true;
    progressWrap.classList.add('active');
    progressBar.style.width = '0%';

    await acquireXferWakeLock();

    log('Requesting CSV pull (XFER_CTRL=1)...');
    await gattOp(() => charXferCtrl.writeValueWithoutResponse(new Uint8Array([1])));

    // Device sets XFER_INFO synchronously inside its write handler, but
    // there's no notification on that characteristic (it's read-only) --
    // give it a brief moment then read it.
    await new Promise(r => setTimeout(r, 150));
    const infoVal = await gattOp(() => charXferInfo.readValue());
    xferTotal = infoVal.getUint32(0, true);

    // P1: 0xFFFFFFFF is a sentinel the firmware sends when it refuses the
    // pull outright because the battery is low -- distinguishable from a
    // genuinely empty buffer (which reports 0).
    if (xferTotal === 0xFFFFFFFF) {
      log('Device refused the download: battery is low. Please charge the device and try again.');
      xferTotal = 0;
      finishCsvDownload(false);
      return;
    }

    log(`Device reports ${xferTotal.toLocaleString()} bytes available.`);

    if (xferTotal === 0) {
      log('Nothing to download (device CSV buffer is empty -- record something first, or the buffer was just refreshed).');
      finishCsvDownload(false);
      return;
    }

    // Cross-check against the last STATUS poll's buffer size -- catches a
    // stale/wrong total before we even start pulling chunks against it.
    if (lastKnownCsvBytes > 0 && xferTotal < lastKnownCsvBytes * 0.5) {
      log(`WARNING: this (${xferTotal.toLocaleString()} bytes) is far smaller than the ` +
          `${lastKnownCsvBytes.toLocaleString()} bytes last seen on the device -- ` +
          `something looks wrong (stale read). Aborting rather than downloading a ` +
          `likely-truncated file. Please wait a moment and try Download again.`);
      finishCsvDownload(false);
      return;
    }

    log(`Downloading ${xferTotal.toLocaleString()} bytes from device (chunked reads) -- keep this tab open and the screen on...`);
    await runChunkedPull();
  } catch (e) {
    log(`Download failed to start: ${e}`);
    finishCsvDownload(false);
  }
}

// P5: the actual pull loop. Requests one chunk at a time by writing the
// desired byte offset to XFER_SEEK, then reads it back from XFER_DATA.
// Each chunk gets its own bounded retry budget; a chunk that still fails
// after retrying aborts the whole download with a clear message (partial
// data is never silently presented as a complete file).
async function runChunkedPull() {
  let offset = 0;
  while (offset < xferTotal) {
    let chunk = null;
    let lastErr = null;

    for (let attempt = 1; attempt <= XFER_CHUNK_MAX_RETRIES; attempt++) {
      try {
        const offBuf = new ArrayBuffer(4);
        new DataView(offBuf).setUint32(0, offset, true);
        await withTimeout(
          gattOp(() => charXferSeek.writeValueWithoutResponse(offBuf)),
          XFER_CHUNK_TIMEOUT_MS, 'seek write');

        const dv = await withTimeout(
          gattOp(() => charXferData.readValue()),
          XFER_CHUNK_TIMEOUT_MS, 'chunk read');

        chunk = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength).slice();
        break;
      } catch (e) {
        lastErr = e;
        if (attempt < XFER_CHUNK_MAX_RETRIES) {
          log(`Chunk at offset ${offset.toLocaleString()} failed (attempt ${attempt}/${XFER_CHUNK_MAX_RETRIES}), retrying: ${e}`);
          await new Promise(r => setTimeout(r, XFER_CHUNK_RETRY_DELAY_MS));
        }
      }
    }

    if (chunk === null) {
      log(`Giving up after ${XFER_CHUNK_MAX_RETRIES} failed attempts at offset ${offset.toLocaleString()}: ${lastErr}. ` +
          `Got ${offset.toLocaleString()} of ${xferTotal.toLocaleString()} bytes so far. Try Download again.`);
      finishCsvDownload(false);
      return;
    }

    if (chunk.byteLength === 0) {
      // Firmware returns an empty chunk once offset >= its total -- normally
      // shouldn't happen before we reach xferTotal ourselves, but treat it
      // as a clean stop rather than looping forever if it does.
      log(`Device returned an empty chunk before reaching the expected total -- stopping at ${offset.toLocaleString()} of ${xferTotal.toLocaleString()} bytes.`);
      break;
    }

    xferChunks.push(chunk);
    offset += chunk.byteLength;
    xferReceived = offset;

    const pct = Math.min(100, (xferReceived / xferTotal) * 100);
    progressBar.style.width = `${pct}%`;
  }

  finishCsvDownload(true);
}

function finishCsvDownload(success) {
  releaseXferWakeLock();
  xferActive = false;
  progressWrap.classList.remove('active');
  btnDownload.disabled = false;

  if (success && xferChunks.length > 0) {
    const blob = new Blob(xferChunks, { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = `bcmch_tremor_${ts}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log(`Downloaded ${xferReceived.toLocaleString()} bytes as CSV (device reported ${xferTotal.toLocaleString()}).`);
    if (xferReceived !== xferTotal) {
      log(`NOTE: received byte count doesn't match what the device reported -- file may be incomplete. Try Download again.`);
    }
  }
  xferChunks = [];
  xferReceived = 0;
  xferTotal = 0;
  pollStatus(); // refresh buffer size / button state now that xferActive is false again
}

// ---- Init ----
setConnectedUI(false);
setRecordingUI(false);
log('Ready. Click "Connect device" to pair over Web Bluetooth.');
log('Note: Web Bluetooth requires HTTPS (or localhost) and Chrome/Edge - not supported in Safari or Firefox.');

// Chrome releases the screen wake lock automatically when a tab is
// backgrounded and does not restore it on its own -- if the user comes
// back to this tab mid-download, try to reacquire it rather than leaving
// the rest of a large transfer exposed to the screen turning off again.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && xferActive && !xferWakeLock) {
    acquireXferWakeLock();
  }
});
</script>
</body>
</html>
